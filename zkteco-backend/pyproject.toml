[project]
name = "zkteco-c3-backend"
version = "1.0.0"
description = "Custom backend for ZKTeco C3 access control panels (replaces ZKAccess 3.5)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # B008: FastAPI's dependency injection *requires* calling Depends() in the
    # default argument of every route signature. This is the documented pattern,
    # not a bug, so the rule is disabled project-wide.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Alembic templates and generated revisions are not ours to style.
"migrations/*" = ["E501", "I001", "F401"]
"migrations/versions/*" = ["E501", "I001", "F401"]

