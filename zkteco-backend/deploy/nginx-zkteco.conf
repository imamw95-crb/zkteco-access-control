# Reverse proxy for the ZKTeco C3 backend.
#
# Copy to /etc/nginx/sites-available/zkteco and symlink into sites-enabled.
# Replace SERVER_NAME with the hostname you want to use.
#
# NOTE: ports 80/443 on 192.168.0.27 are already in use by another site
# (verified 2026-09-16). Use a dedicated server_name, or expose the API on a
# separate port instead of adding this block.

upstream zkteco_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name zkteco.local;   # <-- ganti

    # Internal hospital network only. Tighten as needed.
    # allow 192.168.0.0/24;
    # deny all;

    client_max_body_size 8m;

    location / {
        proxy_pass http://zkteco_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Fleet sync endpoints can take a while: 23 panels x retry budget.
        proxy_connect_timeout 15s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location = /health {
        proxy_pass http://zkteco_api/health;
        access_log off;
    }
}
